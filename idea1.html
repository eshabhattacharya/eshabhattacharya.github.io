<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Idea 1 — Your Name</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-grid">
  <div class="container">
    <header class="header">
      <div class="kicker">/ ideas · idea-1</div>
      <h1>Idea 1: Replace this title</h1>
      <p class="subtitle">Optional: date or one-line description.</p>

      <nav class="nav">
        <a href="index.html">[bio]</a>
        <a href="ideas.html">[ideas]</a>
      </nav>

      <hr class="rule">
      <div class="ascii">========================================</div>
    </header>

    <section class="section">
      <h2>Text</h2>
      <p>Paste your text here.</p>
      <p>More paragraphs…</p>

      <blockquote>
        Optional pull-quote or “note to self.”
      </blockquote>
    </section>
    <p class="footer">
      © <span id="year"></span> Esha Bhattacharya · Last updated: <span id="updated"></span>
    </p>

  </div>

  <script>
    const now = new Date();
    document.getElementById('year').textContent = now.getFullYear();
    document.getElementById('updated').textContent = now.toLocaleDateString(undefined, {
      year: "numeric",
      month: "short",
      day: "numeric"
    });
  </script>
</body>
</html>
